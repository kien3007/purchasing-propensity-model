[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dunnhumby-purchase-propensity"
version = "0.1.0"
description = "Point-in-Time Purchase Propensity Modeling on Dunnhumby The Complete Journey Dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "xgboost>=2.0.0",
    "optuna>=3.4.0",
    "shap>=0.43.0",
    "pandera>=0.17.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]


